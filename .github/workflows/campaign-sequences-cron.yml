name: Trigger campaign sequences

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call run-sequences endpoint
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/internal/run-sequences/" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --fail-with-body
